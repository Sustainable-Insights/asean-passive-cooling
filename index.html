<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sustainable Insights Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .tab-active { background-color: #0d9488; color: white; }
        .fade-in { animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-stone-100 p-8">

    <div class="max-w-6xl mx-auto space-y-8">
        <!-- Header -->
        <header class="bg-white p-6 rounded-2xl shadow-sm border border-stone-200">
            <h1 class="text-3xl font-bold text-stone-900">Sustainable Insights Dashboard</h1>
            <p class="text-stone-600">Regional analysis and policy readiness tracking.</p>
        </header>

        <!-- Main Content Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Country Selector -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-stone-200">
                <h2 class="text-lg font-bold mb-4">Country Policy Status</h2>
                <div id="countryList" class="space-y-2"></div>
            </div>

            <!-- Details Panel -->
            <div id="countryDetails" class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-stone-200">
                <p class="text-stone-500">Select a country to view detailed policy, finance, and gap analysis.</p>
            </div>
        </div>

        <!-- Charts & Tabs Section -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-stone-200 h-80">
                <canvas id="techChart"></canvas>
            </div>
            
            <div class="bg-white rounded-2xl shadow-sm border border-stone-200 overflow-hidden">
                <div id="roleTabs" class="flex border-b border-stone-100"></div>
                <div id="roleContent" class="p-6"></div>
            </div>
        </div>
    </div>

    <script>
        // Data Structures
        const countryData = {
            "Malaysia": { policy: "High", finance: "Moderate", instrument: "Carbon Tax Proposal", targets: "Net Zero 2050", gaps: "Infrastructure scaling" },
            "Singapore": { policy: "Advanced", finance: "High", instrument: "Carbon Pricing Act", targets: "Net Zero 2050", gaps: "Land constraints" }
        };

        const roleData = {
            "Policymakers": { icon: "🏛️", points: ["Regulatory alignment", "Fiscal incentives", "Standardization"] },
            "Investors": { icon: "📈", points: ["Risk assessment", "Capital allocation", "ESG integration"] }
        };

        // Initialize Technical Chart
        const ctxTech = document.getElementById('techChart').getContext('2d');
        new Chart(ctxTech, {
            type: 'bar',
            data: {
                labels: ['Cool Roofs', 'Natural Ventilation', 'Envelope Optimization', 'Shading Systems', 'Advanced Glazing'],
                datasets: [{ label: 'Energy Savings (%)', data: [25, 20, 15, 12, 10], backgroundColor: '#0d9488' }]
            },
            options: { indexAxis: 'y', maintainAspectRatio: false, plugins: { legend: { display: false } } }
        });

        // Dynamic Country List
        const listContainer = document.getElementById('countryList');
        const detailsContainer = document.getElementById('countryDetails');
        Object.keys(countryData).forEach(country => {
            const btn = document.createElement('button');
            btn.className = 'w-full text-left px-4 py-2 hover:bg-teal-50 rounded-lg text-stone-600 transition-all font-medium text-sm';
            btn.innerText = country;
            btn.onclick = () => {
                const data = countryData[country];
                detailsContainer.innerHTML = `
                    <h3 class="text-2xl font-bold text-stone-900 mb-4">${country}</h3>
                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div class="bg-stone-50 p-3 rounded"><p class="text-xs text-stone-500">Policy</p><p class="font-bold text-teal-700">${data.policy}</p></div>
                        <div class="bg-stone-50 p-3 rounded"><p class="text-xs text-stone-500">Finance</p><p class="font-bold text-teal-700">${data.finance}</p></div>
                    </div>
                    <p class="text-sm text-stone-600 mb-4"><strong>Instruments:</strong> ${data.instrument}</p>
                    <p class="text-red-700 bg-red-50 p-3 rounded text-sm"><strong>Gaps:</strong> ${data.gaps}</p>
                `;
            };
            listContainer.appendChild(btn);
        });

        // Role Tabs
        const tabsContainer = document.getElementById('roleTabs');
        const contentContainer = document.getElementById('roleContent');
        Object.keys(roleData).forEach((role, index) => {
            const btn = document.createElement('button');
            btn.className = `tab-btn px-6 py-4 font-bold text-sm ${index === 0 ? 'tab-active' : ''}`;
            btn.innerHTML = `${roleData[role].icon} ${role}`;
            btn.onclick = () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('tab-active'));
                btn.classList.add('tab-active');
                contentContainer.innerHTML = `<h4 class="text-xl font-bold mb-4">${role}</h4><ul class="space-y-2">${roleData[role].points.map(p => `<li>&#8226; ${p}</li>`).join('')}</ul>`;
            };
            tabsContainer.appendChild(btn);
        });
        contentContainer.innerHTML = `<h4 class="text-xl font-bold mb-4">Policymakers</h4><ul class="space-y-2">${roleData["Policymakers"].points.map(p => `<li>&#8226; ${p}</li>`).join('')}</ul>`;
    </script>
</body>
</html>
